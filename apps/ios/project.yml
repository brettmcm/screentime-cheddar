name: Cheddar
options:
  bundleIdPrefix: com.screentime
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  CheddarDS:
    path: Packages/CheddarDS
targets:
  Cheddar:
    type: application
    platform: iOS
    sources:
      - path: CheddarApp
        excludes:
          - Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.screentime.cheddar
      INFOPLIST_FILE: CheddarApp/Info.plist
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: false
    dependencies:
      - package: CheddarDS
